<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tubu - Ücretsiz İndir</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #061b4f, #0b4fa3);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px 20px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      text-align: center;
    }

    .logo {
      width: 190px;
      height: 190px;
      object-fit: cover;
      border-radius: 42px;
      display: block;
      margin: 0 auto 25px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.35);
    }

    h1 {
      font-size: 42px;
      font-weight: 800;
      margin-bottom: 10px;
      letter-spacing: -1px;
    }

    .subtitle {
      font-size: 18px;
      line-height: 1.5;
      opacity: 0.92;
      margin-bottom: 32px;
    }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .button {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 64px;
      padding: 15px 20px;
      border-radius: 16px;
      text-decoration: none;
      color: white;
      font-size: 18px;
      font-weight: 700;
      background: white;
      color: #071b45;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
    }

    .button:active {
      transform: scale(0.97);
    }

    .store-icon {
      font-size: 25px;
      margin-right: 12px;
    }

    .free {
      margin-top: 25px;
      font-size: 14px;
      opacity: 0.8;
    }

    footer {
      margin-top: 35px;
      font-size: 13px;
      opacity: 0.6;
    }
  </style>
</head>

<body>

  <main class="container">

    <img
      src="tubu.logo.jpg.JPG"
      alt="Tubu uygulaması"
      class="logo"
    >

    <h1>Tubu</h1>

    <p class="subtitle">
      Özelleştirilebilir eğitici mobil tabu oyunu.<br>
      Tamamen ücretsiz.
    </p>

    <div class="buttons">

      <a
        class="button"
        href="https://apps.apple.com/app/tubu/id6821864059"
        target="_blank"
        rel="noopener noreferrer"
      >
        <span class="store-icon"></span>
        App Store'dan İndir
      </a>

      <a
        class="button"
        href="https://play.google.com/store/apps/details?id=com.tunahanuysal.tubu"
        target="_blank"
        rel="noopener noreferrer"
      >
        <span class="store-icon">▶</span>
        Google Play'den İndir
      </a>

    </div>

    <p class="free">
      iPhone ve Android için ücretsiz
    </p>

    <footer>
      © 2026 Tubu
    </footer>

  </main>

</body>
</html>
